<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221338">
<meta name="description" content="Host-run Mafia party game in Tamil and English, played on one phone.">
<title>மாஃபியா | பார்ட்டி விளையாட்டு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --marigold: #F7B32B;
    --marigold-deep: #E39B0B;
    --ink: #221338;
    --ink-deep: #140A24;
    --jasmine: #FFF8E7;
    --muted: #5B4A6E;
    --village: #0B7A75;
    --village-deep: #075955;
    --mafia: #D62839;
    --mafia-deep: #A3172A;
    --solo: #7B3FA0;
    --solo-deep: #5A2C77;
    --display: "Baloo Thambi 2", "Noto Sans Tamil", "Tamil Sangam MN", "Tamil MN", "Nirmala UI", "Latha", system-ui, sans-serif;
    --body: "Noto Sans Tamil", "Tamil Sangam MN", "Tamil MN", "Nirmala UI", "Latha", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r-lg: 22px;
    --r-md: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh; min-height: 100dvh;
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    background-color: var(--marigold);
    background-image: radial-gradient(circle, rgba(34, 19, 56, .14) 1.6px, transparent 2.2px);
    background-size: 22px 22px;
    transition: background-color .35s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.dark {
    background-color: var(--ink);
    background-image: radial-gradient(circle, rgba(247, 179, 43, .10) 1.6px, transparent 2.2px);
    color: var(--jasmine);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.25; }
  p { margin: 0; }

  .app { width: 100%; max-width: 520px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .enter { animation: enter .3s cubic-bezier(.2, .8, .2, 1); }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---------- buttons ---------- */
  .btn {
    position: relative; overflow: hidden;
    display: block; width: 100%;
    min-height: 58px;
    padding: 12px 18px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: var(--jasmine); color: var(--ink);
    font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.35;
    text-align: center;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: var(--jasmine); box-shadow: 0 5px 0 var(--ink-deep); }
  .btn.go { background: var(--marigold); color: var(--ink); border-color: var(--marigold); box-shadow: 0 5px 0 var(--marigold-deep); }
  .btn.danger { background: var(--mafia); color: #fff; border-color: var(--mafia-deep); box-shadow: 0 5px 0 var(--mafia-deep); }
  .btn.ghost-dark { background: transparent; color: var(--jasmine); border-color: var(--jasmine); box-shadow: 0 5px 0 rgba(255, 248, 231, .3); }
  .btn.small { min-height: 46px; font-size: 17px; padding: 8px 14px; }
  .btn + .btn, .btn + .link, .stack > * + * { margin-top: 14px; }
  .link {
    display: block; margin: 16px auto 0; padding: 10px 14px;
    background: none; border: none;
    font-weight: 600; font-size: 16px;
    text-decoration: underline; text-underline-offset: 4px;
  }
  :focus-visible { outline: 3px solid var(--village); outline-offset: 3px; }
  body.dark :focus-visible { outline-color: var(--marigold); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
    min-height: 40px; padding: 4px 14px;
    border: 2.5px solid currentColor; border-radius: 999px;
    background: transparent;
    font-weight: 700; font-size: 15px;
  }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; margin-bottom: 14px; }
  .topbar .grow { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; opacity: .85; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; opacity: .5; }
  .dots i.done { background: currentColor; }
  .dots i.now { background: var(--marigold); border-color: var(--marigold); opacity: 1; transform: scale(1.25); }

  /* ---------- panels ---------- */
  .panel {
    background: var(--jasmine); color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: var(--r-lg);
    box-shadow: 0 6px 0 var(--ink);
    padding: 18px 16px 20px;
    margin-bottom: 22px;
  }
  .panel > h2 { font-size: 23px; font-weight: 800; }
  .hint { font-size: 15px; color: var(--muted); margin: 2px 0 12px; }
  body.dark .hint-dark { color: rgba(255, 248, 231, .75); }

  .hero { text-align: center; padding: 4px 0 18px; }
  .hero .mark { font-size: 54px; line-height: 1; }
  .hero h1 { font-size: clamp(44px, 13vw, 60px); font-weight: 800; line-height: 1.15; text-shadow: 3px 3px 0 var(--jasmine); }
  .hero p { margin: 4px auto 0; max-width: 32ch; font-weight: 600; }

  .banner {
    background: var(--ink); color: var(--jasmine);
    border-radius: var(--r-lg);
    padding: 16px;
    margin-bottom: 22px;
  }
  .banner h2 { font-size: 21px; margin-bottom: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 .btn + .btn { margin-top: 0; }

  /* ---------- names ---------- */
  .names { display: grid; gap: 10px; }
  .name-row { display: flex; align-items: center; gap: 8px; }
  .name-row .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--jasmine); font-weight: 700; font-size: 15px;
  }
  .name-row input {
    flex: 1 1 0; min-width: 0; width: 100%; height: 50px;
    padding: 0 14px;
    border: 2.5px solid var(--ink); border-radius: var(--r-md);
    background: #fff; font-size: 18px;
  }
  .name-row input::placeholder { color: #9A8BA8; }
  .name-row input.invalid { border-color: var(--mafia); background: #FFECEE; }
  .x-btn {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(34, 19, 56, .3); background: transparent;
    font-size: 20px; line-height: 1;
  }
  .x-btn:disabled { opacity: .3; cursor: not-allowed; }
  .add-btn { margin-top: 12px; }

  /* ---------- role rows ---------- */
  .team-head { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; font-family: var(--display); font-weight: 800; font-size: 19px; }
  .team-head:first-of-type { margin-top: 6px; }
  .team-head::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
  .roles { display: grid; gap: 10px; }
  .role-row {
    display: grid; grid-template-columns: 36px minmax(0, 1fr); grid-template-areas: "e n" "e d" "e s";
    align-items: center; column-gap: 10px; row-gap: 2px;
    padding: 10px 10px 10px 8px;
    border: 2px solid rgba(34, 19, 56, .18);
    border-left: 6px solid var(--c);
    border-radius: var(--r-md);
    background: #fff;
  }
  .role-row.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 9%, #fff); }
  .role-row .emo { grid-area: e; align-self: start; padding-top: 6px; font-size: 26px; text-align: center; line-height: 1; }
  .role-row .nm { grid-area: n; font-weight: 700; font-size: 17px; line-height: 1.35; }
  .role-row .sh { grid-area: d; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .role-row .stepper { grid-area: s; justify-self: end; margin-top: 4px; }
  @media (min-width: 440px) {
    .role-row { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "e n s" "e d d"; }
    .role-row .stepper { margin-top: 0; }
  }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2.5px solid var(--ink); background: var(--marigold);
    font-size: 22px; font-weight: 700; line-height: 1;
  }
  .stepper button:disabled { opacity: .3; cursor: not-allowed; }
  .stepper output { min-width: 26px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22px; }
  .role-row .del { font-size: 13px; margin-top: 2px; padding: 0; border: none; background: none; text-decoration: underline; color: var(--mafia-deep); }

  details.custom { margin-top: 16px; border: 2.5px dashed var(--ink); border-radius: var(--r-md); padding: 4px 14px; }
  details.custom summary { padding: 10px 0; font-weight: 700; cursor: pointer; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 10px 12px;
    border: 2.5px solid var(--ink); border-radius: var(--r-md); background: #fff; font-size: 17px;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .seg3 button {
    min-height: 46px; padding: 6px 4px;
    border: 2.5px solid var(--ink); border-radius: var(--r-md);
    background: #fff; font-weight: 700; font-size: 15px; line-height: 1.3;
  }
  .seg3 button[aria-pressed="true"] { background: var(--c); color: #fff; border-color: var(--c); }
  .check { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; font-weight: 600; cursor: pointer; }
  .check input { width: 26px; height: 26px; flex: none; margin: 2px 0 0; accent-color: var(--ink); }

  .dock {
    position: sticky; bottom: 0; z-index: 5;
    margin: 0 -16px; padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    background: var(--marigold);
    border-top: 3px solid var(--ink);
  }
  .status { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-weight: 700; }
  .status .ok { color: var(--village-deep); }
  .status .bad { color: var(--mafia-deep); }
  .msg { padding: 10px 12px; border-radius: var(--r-md); font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .msg.err { background: var(--mafia); color: #fff; }
  .msg.warn { background: var(--jasmine); border: 2px solid var(--ink); }

  details.howto { margin: 4px 0 22px; background: rgba(255, 248, 231, .55); border: 2.5px dashed var(--ink); border-radius: var(--r-lg); padding: 4px 16px; }
  details.howto summary { padding: 12px 0; font-weight: 700; font-size: 18px; cursor: pointer; }
  details.howto ol { margin: 0 0 14px; padding-left: 22px; }
  details.howto li { margin-bottom: 8px; }

  /* ---------- handoff / reveal ---------- */
  .center { text-align: center; }
  .handoff { padding-top: 5vh; }
  .handoff .lead { font-size: 18px; opacity: .85; }
  .who { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 62px); line-height: 1.2; color: var(--marigold); margin: 10px 0 16px; overflow-wrap: anywhere; }
  .who.sm { font-size: 30px; margin: 0 0 16px; }
  .who.md { font-size: clamp(28px, 8vw, 38px); }
  .warnbox { display: inline-block; margin: 0 0 36px; padding: 10px 16px; border-radius: var(--r-md); background: rgba(255, 248, 231, .08); border: 1.5px solid rgba(255, 248, 231, .25); font-size: 16px; }
  .done-note { color: #8FE3D2; font-weight: 600; font-size: 15px; margin-bottom: 16px; }

  .card {
    border-radius: 26px;
    border: 3px solid var(--jasmine);
    padding: 24px 18px;
    margin-bottom: 26px;
    user-select: none; -webkit-user-select: none;
  }
  .card.covered {
    min-height: 300px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background-color: var(--jasmine); color: var(--ink);
    background-image: radial-gradient(circle, rgba(34, 19, 56, .18) 2px, transparent 2.6px);
    background-size: 26px 26px;
  }
  .card.covered .q { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--marigold); font-family: var(--display); font-size: 66px; font-weight: 800; margin-bottom: 16px; }
  .card.covered p { font-weight: 600; max-width: 26ch; background: var(--jasmine); padding: 4px 8px; border-radius: 8px; }
  .card.role { color: #fff; background: var(--c); border-color: color-mix(in srgb, var(--c) 45%, #fff); box-shadow: 0 8px 0 var(--cd); animation: flip .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes flip { from { transform: perspective(900px) rotateY(80deg) scale(.94); opacity: .3; } to { transform: none; opacity: 1; } }
  .card.role .top { text-align: center; }
  .card.role .emo { font-size: 64px; line-height: 1.1; }
  .card.role .you { font-size: 16px; opacity: .9; }
  .card.role .rname { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.2; margin: 2px 0 8px; }
  .chip { display: inline-block; padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .2); font-size: 14px; font-weight: 700; }
  .card.role h3 { font-family: var(--body); font-size: 15px; font-weight: 700; opacity: .9; margin: 18px 0 4px; }
  .card.role p { font-size: 17px; line-height: 1.6; }
  .card.role .team { margin-top: 18px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(0, 0, 0, .2); }
  .card.role .team h3 { margin-top: 0; }
  .card.role .team ul { margin: 0; padding-left: 20px; font-weight: 700; }

  .hold { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .hold .fill { position: absolute; inset: 0; width: 0; background: rgba(34, 19, 56, .25); }
  .hold.holding .fill { width: 100%; transition: width 1s linear; }
  .hold .lbl { position: relative; }

  /* ---------- host ---------- */
  .host-tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; padding: 4px 12px; border-radius: 999px; background: var(--ink); color: var(--jasmine); font-weight: 700; font-size: 14px; }
  body.dark .host-tag { background: var(--marigold); color: var(--ink); }
  .phase {
    border-radius: var(--r-lg); padding: 18px 16px;
    margin-bottom: 22px;
    border: 3px solid var(--ink);
  }
  .phase.night { background: var(--ink); color: var(--jasmine); box-shadow: 0 6px 0 var(--ink-deep); }
  .phase.day { background: var(--jasmine); box-shadow: 0 6px 0 var(--ink); }
  .phase h2 { font-size: 32px; font-weight: 800; }
  .phase .sub { margin: 2px 0 14px; font-size: 15px; opacity: .85; }
  .phase .note { margin-bottom: 14px; padding: 10px 12px; border-radius: var(--r-md); background: rgba(123, 63, 160, .14); font-weight: 600; font-size: 15px; }

  .timer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; padding: 10px 12px; border: 2px solid rgba(34, 19, 56, .2); border-radius: var(--r-md); background: #fff; }
  .timer output { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .timer output.up { color: var(--mafia); }
  .timer .tb { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .timer .tb button { min-height: 40px; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--jasmine); font-weight: 700; font-size: 14px; }

  .winbox { margin-bottom: 22px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--village); color: #fff; border: 3px solid var(--ink); }
  .winbox p { font-weight: 700; margin-bottom: 10px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .counts span { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff; background: var(--c); }

  .plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .prow {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px;
    border: 2px solid rgba(34, 19, 56, .18); border-left: 6px solid var(--c);
    border-radius: var(--r-md); background: #fff; text-align: left;
  }
  .prow.dead { background: #EFE8F3; }
  .prow.dead .pn, .prow.dead .pr { opacity: .55; }
  .prow .pe { font-size: 24px; text-align: center; }
  .prow .pn { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; line-height: 1.35; }
  .prow .pr { font-size: 14px; color: var(--muted); }
  .prow .st { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: rgba(34, 19, 56, .08); white-space: nowrap; }
  .prow .st.dead { background: var(--ink); color: var(--jasmine); }
  .tags { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 4px; }
  .tags b { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--solo); color: #fff; }
  .pactions { padding: 10px 0 4px; display: grid; gap: 10px; }

  details.log { margin-top: 18px; }
  details.log summary { font-weight: 700; padding: 8px 0; cursor: pointer; }
  details.log ol { margin: 0; padding-left: 22px; font-size: 15px; }
  details.log li { margin-bottom: 4px; }
  details.log li small { font-weight: 700; color: var(--muted); }

  /* ---------- narration ---------- */
  .script {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(25px, 7.4vw, 32px); line-height: 1.4;
    padding: 18px 18px; margin-bottom: 16px;
    border-radius: var(--r-lg);
    background: rgba(255, 248, 231, .07);
    border: 2px solid rgba(255, 248, 231, .22);
  }
  .script.sleep { font-size: 21px; opacity: .85; margin-top: 18px; }
  .readaloud { font-size: 14px; font-weight: 700; color: var(--marigold); margin-bottom: 6px; }
  .hostnote { padding: 12px 14px; border-radius: var(--r-md); background: rgba(247, 179, 43, .14); border: 1.5px solid rgba(247, 179, 43, .45); font-size: 15px; margin-bottom: 14px; }
  .hostnote b { color: var(--marigold); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .target {
    min-height: 58px; padding: 8px 10px;
    border: 2.5px solid currentColor; border-radius: var(--r-md);
    background: transparent;
    font-weight: 700; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere;
  }
  body:not(.dark) .target { background: #fff; }
  .target[aria-pressed="true"] { background: var(--marigold); color: var(--ink); border-color: var(--marigold); box-shadow: 0 4px 0 var(--marigold-deep); }
  body:not(.dark) .target[aria-pressed="true"] { background: var(--ink); color: var(--jasmine); border-color: var(--ink); box-shadow: 0 4px 0 var(--mafia); }
  .target small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
  .target:disabled { opacity: .35; cursor: not-allowed; }
  .target.none { grid-column: 1 / -1; min-height: 50px; border-style: dashed; }
  .sub-h { font-weight: 700; margin: 14px 0 8px; }

  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px;
    background: var(--ink-deep); color: var(--jasmine);
    text-align: center;
    animation: enter .25s ease;
  }
  .overlay .big { font-size: 110px; line-height: 1; }
  .overlay .res { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1.25; }
  .overlay .btn { max-width: 360px; }

  /* ---------- announcements ---------- */
  .announce { text-align: center; margin: 10px 0 22px; }
  .announce .big-emo { font-size: 56px; line-height: 1.1; }
  .announce h2 { font-size: clamp(28px, 8vw, 36px); font-weight: 800; }
  .lines { display: grid; gap: 10px; margin-bottom: 22px; }
  .line { padding: 14px 16px; border-radius: var(--r-lg); border: 3px solid var(--ink); background: var(--jasmine); font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.4; box-shadow: 0 5px 0 var(--ink); }
  .line.death { background: var(--mafia); color: #fff; border-color: var(--mafia-deep); box-shadow: 0 5px 0 var(--mafia-deep); }
  .line.good { background: var(--village); color: #fff; border-color: var(--village-deep); box-shadow: 0 5px 0 var(--village-deep); }
  .line.solo { background: var(--solo); color: #fff; border-color: var(--solo-deep); box-shadow: 0 5px 0 var(--solo-deep); }
  .private { margin-bottom: 22px; padding: 12px 14px; border-radius: var(--r-md); border: 2.5px dashed var(--ink); background: rgba(255, 248, 231, .7); font-size: 15px; font-weight: 600; }

  /* =====================================================================
     HELPERS
     ===================================================================== */
  const MIN_PLAYERS = 4, MAX_PLAYERS = 20, HOLD_MS = 1000, TAP_GUARD_MS = 450;
  const SETTINGS_KEY = "mafia-settings-v1", GAME_KEY = "mafia-game-v1";
  const $app = document.getElementById("app");

  function randInt(n) {
    const c = window.crypto;
    if (c && c.getRandomValues) {
      const buf = new Uint32Array(1), limit = Math.floor(0x100000000 / n) * n;
      do { c.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function store(key, v) { try { if (v == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

  let lockUntil = 0;
  function lockTaps(ms) { lockUntil = Date.now() + (ms || TAP_GUARD_MS); }

  // Tiny element builder. Click handlers are tap-guarded automatically.
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "style") e.style.cssText = v;
      else if (k === "onclick") e.addEventListener("click", ev => { if (Date.now() < lockUntil) { ev.preventDefault(); return; } v(ev); });
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "value" || k === "checked") e[k] = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    }
    return e;
  }

  /* =====================================================================
     SETTINGS + LANGUAGE
     ===================================================================== */
  const savedSettings = load(SETTINGS_KEY) || {};
  const settings = {
    lang: savedSettings.lang === "en" ? "en" : "ta",
    names: Array.isArray(savedSettings.names) && savedSettings.names.length ? savedSettings.names.slice(0, MAX_PLAYERS).map(String) : ["", "", "", "", "", "", ""],
    counts: savedSettings.counts && typeof savedSettings.counts === "object" ? savedSettings.counts : { mafia: 1, boss: 1, villager: 2, doctor: 1, police: 1, detective: 1 },
    custom: Array.isArray(savedSettings.custom) ? savedSettings.custom : [],
    revealRoles: !!savedSettings.revealRoles
  };
  function saveSettings() { store(SETTINGS_KEY, settings); }

  function t(key, params) {
    let s = STR[settings.lang][key];
    if (s == null) s = STR.en[key];
    if (s == null) return key;
    if (typeof s !== "string") return s;
    return s.replace(/\{(\w+)\}/g, (m, k) => (params && params[k] != null ? params[k] : m));
  }

  /* =====================================================================
     ENGINE (pure game rules over a plain state object)
     ===================================================================== */
  function customOf(key, g) {
    const list = (g && g.customRoles) || settings.custom;
    return list.find(c => c.id === key) || null;
  }
  function teamOf(key, g) {
    if (ROLES[key]) return ROLES[key].team;
    const c = customOf(key, g);
    return c ? c.team : "village";
  }
  function roleInfo(key, g) {
    if (ROLES[key]) {
      const tx = ROLE_TEXT[settings.lang][key];
      return { key, team: ROLES[key].team, emoji: ROLES[key].emoji, name: tx.name, short: tx.short, does: tx.does };
    }
    const c = customOf(key, g);
    if (!c) return { key, team: "village", emoji: "❔", name: key, short: "", does: "" };
    return { key, team: c.team, emoji: c.wakes ? "🌙" : "⭐", name: c.name, short: c.desc || t("customDefaultDesc"), does: c.desc || t("customDefaultDesc"), custom: true, wakes: c.wakes };
  }
  const roleName = (key, g) => roleInfo(key, g).name;

  function createGame(names, counts, customRoles, revealRoles) {
    const deck = [];
    Object.keys(counts).forEach(k => { for (let i = 0; i < counts[k]; i++) deck.push(k); });
    if (deck.length !== names.length) throw new Error("deck size mismatch");
    shuffle(deck);
    const present = {};
    deck.forEach(k => { present[k] = true; });
    return {
      v: 1,
      players: names.map((name, i) => ({ name, role: deck[i], alive: true })),
      customRoles: JSON.parse(JSON.stringify(customRoles || [])),
      present, revealRoles: !!revealRoles,
      stage: "reveal", revealIdx: 0, reshow: null,
      round: 1, phase: "night-ready",
      night: null, morning: null, haunted: null, lovers: null,
      witchUsed: { heal: false, poison: false },
      hunterQueue: [], afterHunter: null, lastVote: undefined, lastHunterShot: undefined,
      log: [], winner: null, winnerIdx: null
    };

  const holders = (g, key) => g.players.map((p, i) => i).filter(i => key === "mafia" ? teamOf(g.players[i].role, g) === "mafia" : g.players[i].role === key);
  const aliveIdx = g => g.players.map((p, i) => i).filter(i => g.players[i].alive);
  const holderOf = (g, key) => { const hs = holders(g, key); return hs.length ? hs[0] : null; };
  function logPh(g) { return (g.phase === "night" || g.phase === "morning" || (g.phase === "hunter" && g.afterHunter === "day")) ? "night" : "day"; }
  function addLog(g, entry) { entry.r = g.round; entry.ph = entry.ph || logPh(g); g.log.push(entry); }

  const NIGHT_ORDER = ["cupid", "mafia", "framer", "killer", "bodyguard", "doctor", "witch", "police", "detective", "ghost"];

  function buildNightSteps(g) {
    const steps = [];
    const anyMafiaPresent = Object.keys(g.present).some(k => teamOf(k, g) === "mafia");
    NIGHT_ORDER.forEach(key => {
      if (key === "mafia") {
        if (anyMafiaPresent) steps.push({ key, active: holders(g, "mafia").some(i => g.players[i].alive), sel: "one" });
        return;
      }
      if (!g.present[key]) return;
      const hs = holders(g, key);
      const anyAlive = hs.some(i => g.players[i].alive);
      if (key === "cupid") { if (g.round === 1) steps.push({ key, active: anyAlive, sel: "two" }); return; }
      if (key === "ghost") { steps.push({ key, active: hs.some(i => !g.players[i].alive), sel: "one", ghostAlive: anyAlive }); return; }
      if (key === "witch") { steps.push({ key, active: anyAlive && !(g.witchUsed.heal && g.witchUsed.poison), sel: "witch", witchEmpty: anyAlive }); return; }
      steps.push({ key, active: anyAlive, sel: "one" });

    });
    return steps;
  }

  function startNight(g) {

    g.morning = null;

  }

  function stepDone(g, step) {

    if (!step.active) return true;
    if (step.sel === "two") return a.cupid !== undefined && (a.cupid === null || a.cupid.length === 2);
    if (step.sel === "witch") return (g.witchUsed.heal || a.witchHeal !== undefined) && (g.witchUsed.poison || a.witchPoison !== undefined);
    return a[step.key] !== undefined;
  }

  function policeResult(g, i) {
    const n = g.night;

  function killPlayer(g, i, cause) {

    if (cause !== "host" && g.lovers && g.lovers.indexOf(i) !== -1) {

  function resolveNight(g) {

    if (a.framer != null) addLog(g, { t: "frame", i: a.framer });
    if (a.police != null) addLog(g, { t: "police", i: a.police, res: g.night.results.police });
    if (a.detective != null) addLog(g, { t: "detective", i: a.detective, role: g.night.results.detective });

    const attacks = [];
    if (a.mafia != null) attacks.push({ t: a.mafia, by: "mafia" });
    else if (g.night.steps.some(s => s.key === "mafia" && s.active)) addLog(g, { t: "nokill" });
    if (a.killer != null) attacks.push({ t: a.killer, by: "killer" });

    const bg = holderOf(g, "bodyguard");
    attacks.forEach(at => {

      if (bg != null && g.players[bg].alive && a.bodyguard === at.t && bg !== at.t) {

    const g = game;
    hostTop(v, h("button", { class: "pill", type: "button", onclick: () => { g.phase = "day"; go("host"); } }, "‹ " + t("dayN", { n: g.round })));
    v.appendChild(h("div", { class: "announce" },
      h("div", { class: "big-emo", "aria-hidden": "true" }, "🗳️"),
      h("h2", { text: t("voteTitle") })));
    v.appendChild(h("p", { class: "line", style: "font-family:var(--body);font-size:17px;font-weight:600;margin-bottom:12px", text: t("voteHint") }));
    if (g.haunted != null && g.players[g.haunted].alive) v.appendChild(h("p", { class: "private", text: "👻 " + t("hauntLine", { name: pname(g.haunted) }) }));
    const mayor = holderOf(g, "mayor");
    if (mayor != null && g.players[mayor].alive) v.appendChild(h("p", { class: "private", text: "🎖️ " + t("mayorNote", { name: pname(mayor) }) }));
    const grid = h("div", { class: "grid", role: "group" });
    aliveIdx(g).forEach(i => grid.appendChild(h("button", { class: "target", type: "button", "aria-pressed": String(ui.votePick === i),
      onclick: () => { ui.votePick = i; rerender(); } }, pname(i), g.haunted === i ? h("small", null, "👻 " + t("cantVote")) : null)));
    grid.appendChild(h("button", { class: "target none", type: "button", "aria-pressed": String(ui.votePick === null),
      onclick: () => { ui.votePick = null; rerender(); } }, t("noElim")));
    v.appendChild(grid);
    v.appendChild(h("button", { class: "btn danger", type: "button", style: "margin-top:18px", disabled: ui.votePick === undefined,
      onclick: () => { castVote(g, ui.votePick); ui.votePick = undefined; go("voteResult"); } },
      ui.votePick == null ? (ui.votePick === null ? t("noElim") : t("voteTitle")) : t("eliminate", { name: pname(ui.votePick) })));
  }

  function renderVoteResult(v) {
    const g = game, i = g.lastVote;
    hostTop(v);
    v.appendChild(h("p", { class: "readaloud", style: "color:var(--ink);margin-top:10px", text: t("readAloud") }));
    const lines = h("div", { class: "lines" });
    if (i == null) lines.appendChild(h("div", { class: "line" }, t("noOutLine")));
    else {
      const p = g.players[i];
      if (p.role === "jester") lines.appendChild(h("div", { class: "line solo" }, "🤡 " + t("jesterLine", { name: p.name })));
      else lines.appendChild(h("div", { class: "line death" }, "⚖️ " + t("outLine", { name: p.name }) + (g.revealRoles ? " " + t("wasRole", { name: p.name, role: roleName(p.role, g) }) : "")));
      g.players.forEach((q, j) => { if (j !== i && !q.alive && q.cause === "heartbreak" && g.lovers && g.lovers.indexOf(i) !== -1 && g.lovers.indexOf(j) !== -1) lines.appendChild(deathLine(j)); });
    }
    v.appendChild(lines);
    v.appendChild(h("button", { class: "btn primary", type: "button", onclick: () => { advanceAfterDeaths(g, "night-ready"); routeByPhase(); } }, t("continue")));
  }

  function renderOver(v) {
    const g = game, w = g.winner || "none";
    const colors = { village: TEAM_COLORS.village, mafia: TEAM_COLORS.mafia, jester: TEAM_COLORS.solo, killer: TEAM_COLORS.solo, none: ["#221338", "#140A24"] };
    const emo = { village: "🎉", mafia: "🕴️", jester: "🤡", killer: "🔪", none: "🎭" }[w];
    v.appendChild(h("div", { class: "topbar" }, h("span"), langToggle()));
    v.appendChild(h("div", { class: "result-hero", style: "--c:" + colors[w][0] + ";--cd:" + colors[w][1] },
      h("div", { class: "big-emo", "aria-hidden": "true" }, emo),
      h("h2", { text: t("win_" + w) }),
      h("p", { text: t("winSub_" + w, { name: g.winnerIdx != null ? pname(g.winnerIdx) : "" }) })));
    const list = h("ul", { class: "plist" });
    g.players.forEach(p => {
      const info = roleInfo(p.role, g);
      list.appendChild(h("li", null, h("div", { class: "prow" + (p.alive ? "" : " dead"), style: "--c:" + teamColor(info.team)[0] },
        h("span", { class: "pe", "aria-hidden": "true" }, info.emoji),
        h("span", null, h("span", { class: "pn" }, p.name), h("div", { class: "pr" }, info.name)),
        h("span", { class: "st" + (p.alive ? "" : " dead") }, p.alive ? t("alive") : t("dead")))));
    });
    v.appendChild(h("section", { class: "panel" }, h("h2", { text: t("allRoles"), style: "margin-bottom:12px" }), list, logView(true)));
    v.appendChild(h("button", { class: "btn primary", type: "button", onclick: () => {
      const counts = {};
      g.players.forEach(p => { counts[p.role] = (counts[p.role] || 0) + 1; });
      game = createGame(g.players.map(p => p.name), counts, g.customRoles, g.revealRoles);
      go("handoff", { shown: false });
    } }, t("playAgain")));
    v.appendChild(h("button", { class: "btn", type: "button", onclick: () => { game = null; store(GAME_KEY, null); go("setup"); } }, t("changeSetup")));
  }

  const SCREENS = {
    setup: renderSetup, handoff: renderHandoff, reveal: renderReveal, back: renderBack,
    host: renderHost, narrate: renderNarrate, morning: renderMorning, hunter: renderHunter,
    vote: renderVote, voteResult: renderVoteResult, over: renderOver
  };

  window.addEventListener("beforeunload", e => {
    if (game && game.phase !== "over") { e.preventDefault(); e.returnValue = ""; }
  });

  go("setup");
})();
</script>
</body>
</html>
